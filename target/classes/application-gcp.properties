spring.application.name=ridhitek-image-plugin
server.port=${PORT:8082}

# Database (Cloud SQL via socket factory)
spring.datasource.url=${DB_URL:jdbc:postgresql:///ridhitek_plugin_db?cloudSqlInstance=ridhitek-2025:us-central1:plugin-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory&useSSL=false}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# GCS (image uploads)
gcp.storage.bucket-name=${GCS_BUCKET_NAME:ridhitek-uat-images}
app.image.base.url=${IMAGE_BASE_URL:https://storage.googleapis.com/ridhitek-uat-images}
app.image.storage.path=${IMAGE_STORAGE_PATH:/tmp/candidate-images}
