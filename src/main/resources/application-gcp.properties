spring.application.name=ridhitek-image-plugin
server.port=${PORT:8082}
server.forward-headers-strategy=framework

# Database (Cloud SQL via socket factory)
spring.datasource.url=${IMAGE_DB_URL:jdbc:postgresql:///ridhitek_image_db?cloudSqlInstance=${GCP_PROJECT_ID}:${GCP_REGION}:${GCP_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&useSSL=false}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Timezone: Store all timestamps in UTC in database, but JVM uses Asia/Kolkata (IST)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson (JSON Serialization) - Use India Standard Time
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# GCS (image uploads)
gcp.storage.bucket-name=${GCS_BUCKET_NAME:ridhitek-uat-images}
app.image.base.url=${IMAGE_BASE_URL:https://storage.googleapis.com/ridhitek-uat-images}
app.image.storage.path=${IMAGE_STORAGE_PATH:/tmp/candidate-images}

# Logging
logging.level.org.springframework=INFO
logging.level.com.ridhitek=DEBUG